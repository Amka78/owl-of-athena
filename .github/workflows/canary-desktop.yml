name: Canary Desktop Build (Electrobun)

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-electrobun/**"
      - "assets/**"
      - "app.config.ts"
      - "electrobun.config.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/canary-desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canary-desktop
  cancel-in-progress: true

jobs:
  build:
    name: Canary ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            artifact: canary-linux
          - name: Windows x64
            os: windows-latest
            artifact: canary-windows
          - name: macOS
            os: macos-latest
            artifact: canary-macos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Export web
        env:
          EXPO_NO_DOTENV: "1"
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: bunx expo export --platform web --output-dir dist

      # Canary は --env=canary。バージョンは実行番号で一意にする。
      - name: Build desktop (canary)
        env:
          ELECTROBUN_APP_VERSION: 1.0.0-canary.${{ github.run_number }}
        run: bunx electrobun build --env=canary

      - name: Upload canary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist-desktop-artifacts/
          if-no-files-found: error
          retention-days: 7
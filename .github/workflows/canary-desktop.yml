name: Canary Desktop Build (Electrobun)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Canary バージョン（例: 1.1.0-canary.1）。空なら 1.0.0-canary.<run_number>"
        required: false
        type: string
      ref:
        description: "ビルドするブランチ／タグ。空なら main"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: canary-desktop
  cancel-in-progress: true

jobs:
  build:
    name: Canary ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ inputs.version != '' && inputs.version || format('1.0.0-canary.{0}', github.run_number) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            artifact: canary-linux
          - name: Windows x64
            os: windows-latest
            artifact: canary-windows
          - name: macOS
            os: macos-latest
            artifact: canary-macos
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 既定ブランチは master のままなので、ref 未指定なら main を明示する。
          ref: ${{ inputs.ref || 'main' }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Export web
        env:
          EXPO_NO_DOTENV: "1"
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: bunx expo export --platform web --output-dir dist

      # Canary は --env=canary。バージョンは実行番号で一意にする。
      - name: Build desktop (canary)
        env:
          ELECTROBUN_APP_VERSION: ${{ env.VERSION }}
        run: bunx electrobun build --env=canary

      - name: Upload canary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist-desktop-artifacts/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create Canary Pre-Release
    needs: build
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version != '' && inputs.version || format('1.0.0-canary.{0}', github.run_number) }}
    steps:
      # gh が git リポジトリからリポジトリ名を特定するため、checkout を用意する。
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download canary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: canary-*
          path: release-assets
          merge-multiple: true

      - name: Create or update canary pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ env.VERSION }}
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* \
              --title "Owl of Athena Canary ${VERSION}" \
              --generate-notes \
              --prerelease
          fi
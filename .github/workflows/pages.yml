name: Deploy Web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # GitHub Pages のプロジェクトページは /<repo>/ 配下で配信されるため、
      # CI のときだけ Expo の baseUrl を合わせる。
      # EXPO_PUBLIC_* はクライアントへ埋め込まれる公開値のみを渡す。
      - name: Export web
        env:
          EXPO_NO_DOTENV: "1"
          PAGES_BASE_URL: /owl-of-athena
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: bunx expo export --platform web --output-dir dist

      # SPA の直接 URL を GitHub Pages の 404 から index.html へ戻す。
      # _expo 配下を Jekyll に処理させないため .nojekyll も置く。
      - name: Prepare Pages files
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy Web
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4